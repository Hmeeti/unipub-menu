services:
  - type: web
    name: unipub-admin
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ADMIN_PIN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        value: Hmeeti
      - key: GITHUB_REPO
        value: unipub-menu
      - key: GITHUB_BRANCH
        value: main
      - key: GITHUB_PATH
        value: js/menu-data.js
      - key: SESSION_SECRET
        generateValue: true
      - key: MENU_URL
        value: https://hmeeti.github.io/unipub-menu/
