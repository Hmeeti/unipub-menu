# Backend on Render (Blueprint): API for the static menu on GitHub Pages, Telegram bot, admin.
# Dashboard → New → Blueprint → this repository. Values marked `sync: false` are asked once.
# Free plans: the web service sleeps after 15 min idle (first request wakes it in ~1 min);
# Free Postgres expires 30 days after creation — upgrade it or move DATABASE_URL elsewhere.
services:
  - type: web
    name: unipub-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /api/healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTO_MIGRATE
        value: "true"
      - key: SEED_IF_EMPTY
        value: "true"
      - key: WORKER_MODE
        value: inline
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: CLIENT_IP_HEADER
        value: x-forwarded-for
      - key: TELEGRAM_AUTO_WEBHOOK
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: unipub-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: unipub-kv
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: TABLE_TOKEN_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ADMIN_LOGIN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: keyvalue
    name: unipub-kv
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: unipub-db
    plan: free
    region: frankfurt
    databaseName: unipub
    ipAllowList: []
