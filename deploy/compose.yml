# Production stack. Usage on the VPS (see RUNBOOK.md):
#   cd /opt/unipub/deploy && docker compose up -d        (.env lives next to this file)
name: unipub

x-app: &app
  image: ${APP_IMAGE:-ghcr.io/hmeeti/unipub-app:latest}
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgres://unipub:${POSTGRES_PASSWORD}@postgres:5432/unipub
    REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  migrate:
    <<: *app
    restart: "no"
    command: ["node", "dist/migrate.mjs"]

  app:
    <<: *app
    environment:
      DATABASE_URL: postgres://unipub:${POSTGRES_PASSWORD}@postgres:5432/unipub
      REDIS_URL: redis://redis:6379/0
      WORKER_MODE: external
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    expose: ["3000"]
    stop_grace_period: 30s

  worker:
    <<: *app
    command: ["node", "dist/worker.mjs"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    stop_grace_period: 30s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: unipub
      POSTGRES_USER: unipub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      TZ: Asia/Almaty
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unipub -d unipub"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "volatile-lru",
      ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
      STAGING_DOMAIN: ${STAGING_DOMAIN:-}
      STAGING_BASIC_AUTH_USER: ${STAGING_BASIC_AUTH_USER:-}
      STAGING_BASIC_AUTH_HASH: ${STAGING_BASIC_AUTH_HASH:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-extra:/etc/caddy/extra:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [app]

  backup:
    build: ./backup
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: postgres
      PGUSER: unipub
      PGDATABASE: unipub
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Almaty
    depends_on:
      postgres: { condition: service_healthy }

  # ── Staging (same VPS, isolated DB/Redis): docker compose --profile staging up -d ──
  app-staging:
    image: ${STAGING_IMAGE:-ghcr.io/hmeeti/unipub-app:staging}
    profiles: [staging]
    restart: unless-stopped
    env_file: .env.staging
    environment:
      DATABASE_URL: postgres://unipub:${POSTGRES_PASSWORD}@postgres:5432/unipub_staging
      REDIS_URL: redis://redis:6379/1
      WORKER_MODE: inline
      AUTO_MIGRATE: "true"
      APP_ENV: staging
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    expose: ["3000"]

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
