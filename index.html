<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="UNIPUB — электронное меню караоке-бара и ресторана в Таразе. ул. Сулейменова 26В.">
  <meta property="og:title" content="UNIPUB — Меню">
  <meta property="og:description" content="Karaoke Bar & Restaurant · Taraz. Закуски, гриль, коктейли, VIP-залы.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">
  <meta name="twitter:card" content="summary_large_image">
  <title>UNIPUB — Меню</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <div class="aurora__blob aurora__blob--1"></div>
    <div class="aurora__blob aurora__blob--2"></div>
    <div class="aurora__blob aurora__blob--3"></div>
  </div>

  <div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>

  <div class="splash" id="splash">
    <div class="splash__inner">
      <p class="wordmark" aria-label="unipub">unipub<span class="wordmark__dot" aria-hidden="true"></span></p>
      <div class="splash__line"></div>
      <p class="splash__tag">Karaoke Bar &amp; Restaurant</p>
    </div>
  </div>

  <div class="wrap">
    <div class="topbar">
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="ru" class="is-active">RU</button>
        <button type="button" data-lang="kz">KZ</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <button class="chip-btn" id="themeBtn" type="button">Светлая</button>
    </div>

    <header class="site-header" id="top">
      <p class="greeting" id="greeting">Добро пожаловать</p>
      <h1 class="wordmark wordmark--header" aria-label="unipub">unipub<span class="wordmark__dot" aria-hidden="true"></span></h1>
      <p class="logo-sub" id="logoSub">Karaoke Bar &amp; Restaurant · Taraz</p>
      <p class="welcome" id="welcome"><span class="dot" aria-hidden="true"></span>Загрузка меню…</p>

      <div class="contacts-strip" id="contacts"></div>

      <div class="search-wrap">
        <div class="search-field">
          <label class="sr-only" for="search">Поиск</label>
          <input id="search" type="search" placeholder="Поиск блюда..." autocomplete="off" maxlength="80" enterkeyhint="search">
          <button class="search-clear" id="searchClear" type="button" aria-label="Очистить">&times;</button>
        </div>
      </div>
    </header>

    <div class="sticky-nav" id="stickyNav">
      <div class="filters" id="filters" aria-label="Фильтры"></div>
      <div class="tabs" id="tabs" role="tablist" aria-label="Категории"></div>
    </div>

    <main>
      <div class="recent" id="recent"></div>
      <div id="menuRoot"></div>
      <div class="empty" id="emptyState"></div>

      <section class="rules" id="rules" aria-labelledby="rulesTitle">
        <h2 id="rulesTitle">Правила заведения</h2>
        <ul id="rulesList"></ul>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer__grid" id="footerGrid"></div>
      <p>© 2026 UNIPUB · Taraz</p>
    </footer>
  </div>

  <nav class="dock" id="dock" aria-label="Быстрая навигация">
    <button type="button" class="dock__btn is-active" data-action="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg>
      <span id="dockMenuLabel">Меню</span>
    </button>
    <button type="button" class="dock__btn" data-action="categories">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span id="dockSectionsLabel">Разделы</span>
    </button>
    <button type="button" class="dock__btn" data-action="rules">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 4h10v16H7z"/><path d="M10 8h4M10 12h4M10 16h2" stroke-linecap="round"/></svg>
      <span id="dockRulesLabel">Правила</span>
    </button>
    <button type="button" class="dock__btn" data-action="top">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 19V5M6 11l6-6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="dockTopLabel">Наверх</span>
    </button>
  </nav>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Карточка блюда">
    <div class="modal__panel">
      <div class="modal__media" id="modalMedia"></div>
      <div class="modal__body" id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/menu-data.js"></script>
  <script src="js/search.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
